:root{
  --bg:#fbf6ec; --bg2:#f4ecdc; --surface:#ffffff; --glass:rgba(255,255,255,.72);
  --ink:#1b1530; --muted:#5d5670; --faint:#8c86a0; --line:#e7dcc8;
  --gold:#a8720c; --gold-hi:#e8b64c; --lotus:#d23a70; --indigo:#2b2272; --jade:#0b8a5c; --jade-ink:#fff;
  --water:#bcd7ea; --park:#cfe6c4; --watg:#f3dca0; --road:#ddd3c1; --road2:#c9bca4; --street:#e6ddcc;
  --shadow:0 1px 2px rgba(27,21,48,.06),0 8px 28px rgba(27,21,48,.08);
  --r:18px;
  --khmer:"Kantumruy Pro",system-ui,sans-serif;
  --body:"Kantumruy Pro","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Noto Sans Thai",Georgia,serif;
  --moul:"Moul","Kantumruy Pro",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0b1f; --bg2:#141130; --surface:#17142e; --glass:rgba(23,20,46,.72);
  --ink:#f3eee2; --muted:#b3adc9; --faint:#7f7a99; --line:#2b2650;
  --gold:#f0c05a; --gold-hi:#ffd98a; --lotus:#ff6b9a; --indigo:#8f86ff; --jade:#2fd394; --jade-ink:#062a1c;
  --water:#123353; --park:#15321f; --watg:#3a2f14; --road:#342e60; --road2:#4a4282; --street:#241f47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;overflow-x:hidden}
:lang(th) body,body.th{line-height:1.75}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px;border-radius:8px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.kh{font-family:var(--khmer)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;min-height:min(92vh,760px);color:#fff;display:flex;flex-direction:column;overflow:hidden;background:#0d0b1f}
.hero .ph{position:absolute;inset:-4%;z-index:-3;background-size:cover;background-position:center;transform:scale(1.04)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  linear-gradient(180deg,rgba(13,11,31,.55) 0%,rgba(13,11,31,.08) 32%,rgba(13,11,31,.25) 58%,rgba(13,11,31,.94) 100%),
  radial-gradient(90% 70% at 20% 90%,rgba(210,58,112,.28),transparent 60%)}
#motes{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 0;max-width:1100px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;text-decoration:none;opacity:.92}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 14px var(--gold-hi)}
.langs{margin-left:auto;display:flex;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.18)}
.langs button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-size:.86rem;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{background:#fff;color:#1b1530;font-weight:700}
.hero-in{margin-top:auto;padding:0 16px 26px;max-width:1100px;width:100%;margin-left:auto;margin-right:auto}
.clock{font-size:.95rem;opacity:.95;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.clock b{font-variant-numeric:tabular-nums;font-size:1.2rem;letter-spacing:.02em}
.clock .ico{width:20px;height:20px;color:var(--gold-hi)}
.wm{font-family:var(--moul);font-weight:400;font-size:clamp(3.2rem,15vw,7.4rem);line-height:1.25;margin:0;color:#ffe3a3;
  background:linear-gradient(100deg,#fff1c9 0%,#f0c05a 30%,#fff6d8 50%,#e8b64c 70%,#fff1c9 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 26px rgba(240,192,90,.35))}
.wm-sub{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.4rem);font-style:italic;font-weight:500;margin:0 0 4px;line-height:1.2}
.wm-sub .th{font-family:"Noto Sans Thai",sans-serif;font-style:normal;font-size:.62em;opacity:.85;margin-left:.4em}
.sunline{margin:2px 0 16px;opacity:.92;font-size:.98rem;max-width:40ch}

/* where to */
.whereto{display:flex;align-items:center;gap:10px;background:var(--glass);color:var(--ink);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);max-width:620px;position:relative}
.whereto::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;padding:2px;
  background:conic-gradient(from var(--a,0deg),#f0c05a,#ff6b9a,#8f86ff,#2fd394,#f0c05a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
.whereto .ico{color:var(--lotus)}
.whereto input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.08rem;padding:10px 0;color:inherit;outline:none}
.whereto input::placeholder{color:var(--muted)}
.whereto button{border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:10px 18px;font-weight:700;cursor:pointer;min-height:46px}

/* ---------- tiles (Grab-style services) ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin:22px 0 8px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;text-align:center;font-size:.86rem;line-height:1.3;padding:4px 2px;border-radius:14px}
.tile .sq{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 6px 16px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.35);
  background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000))}
.tile .sq .ico{width:30px;height:30px;stroke-width:1.8}
.tile .n{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .tile .sq{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .tile:hover .sq,.tile:focus-visible .sq{transform:translateY(-4px) scale(1.06) rotate(-3deg)}
  .tile:active .sq{transform:scale(.9)}
}

/* ---------- sections ---------- */
section.sec{padding:26px 0 8px}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sh h2{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.1;margin:0}
.sh h2 small{font-family:var(--body);font-size:.95rem;font-weight:400;color:var(--muted);margin-left:.4em}
.sh .more{margin-left:auto;font-size:.9rem;text-decoration:none;color:var(--gold);font-weight:600}
.lede{color:var(--muted);margin:-4px 0 14px;font-size:.95rem;max-width:62ch}
.kicker{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* near */
.nearbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:42px;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.go{background:var(--lotus);color:#fff;border-color:transparent;font-weight:700}
.pill .ico{width:18px;height:18px}
.here{font-size:1.02rem;margin:0 0 12px}
.here b{font-family:var(--serif);font-size:1.3rem}
.rowhead{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:700}
.rowhead .ico{color:var(--c)}
.rowhead a{margin-left:auto;font-weight:600;font-size:.86rem;color:var(--gold);text-decoration:none}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,270px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-height:92px;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--gold))}
.pc .nm{font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .mt{font-size:.8rem;color:var(--muted)}
.pc .d{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--c,var(--gold));font-variant-numeric:tabular-nums}

/* now */
.nowgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.nowgrid{grid-template-columns:1fr 1.2fr}}

/* linked-image cards: background · scrim · spacer · text */
a.shot{position:relative;display:block;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;background:#1b1530;box-shadow:var(--shadow)}
a.shot .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
a.shot .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,11,31,0) 30%,rgba(13,11,31,.86) 100%)}
a.shot .sp{display:block;padding-top:var(--ratio,72%)}
a.shot .tx{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;line-height:1.3}
a.shot .tx b{display:block;font-size:1.08rem}
a.shot .tx .k{display:block;font-family:var(--khmer);font-size:.88rem;opacity:.88}
a.shot .tx .dist{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.18);padding:1px 8px;border-radius:999px;backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:no-preference){
  a.shot .bg{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
  a.shot:hover .bg,a.shot:focus-visible .bg{transform:scale(1.07)}
}
.cred{display:block;font-size:.66rem;color:var(--faint);margin-top:3px;line-height:1.35}
.cred a{color:inherit}
.golist{grid-auto-columns:min(72%,300px)}

/* soon */
.soon{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);text-decoration:none}
.ev .when{border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background-size:cover;background-position:center;position:relative;isolation:isolate;overflow:hidden}
.ev .when::before{content:"";position:absolute;inset:0;background:rgba(13,11,31,.5);z-index:-1}
.ev .when b{font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.ev .when small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.ev h4{margin:0;font-size:1.05rem;line-height:1.3}
.ev .k{font-family:var(--khmer);font-size:.82rem;color:var(--muted);display:block}
.ev p{margin:2px 0 0;font-size:.9rem;color:var(--muted);line-height:1.5}
.ev .cd{font-weight:700;color:var(--lotus);font-size:.85rem}
.ev .src{font-size:.75rem;color:var(--faint)}

  .tiles .tile:nth-child(9){transition-delay:.32s}.tiles .tile:nth-child(10){transition-delay:.36s}.tiles .tile:nth-child(11){transition-delay:.4s}.tiles .tile:nth-child(12){transition-delay:.44s}
  .hscroll>.rv:nth-child(2){transition-delay:.07s}.hscroll>.rv:nth-child(3){transition-delay:.14s}.hscroll>.rv:nth-child(4){transition-delay:.21s}
  .sh h2{position:relative}
  .sh h2::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:64px;background:linear-gradient(90deg,var(--gold-hi),var(--lotus));transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.7,.2,1) .2s}
  .sh.in h2::after{transform:scaleX(1)}
  .tile .sq::after{content:"";position:absolute;inset:-4px;border-radius:24px;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);opacity:0;transition:opacity .4s}
  .tile:hover .sq::after,.tile:focus-visible .sq::after{opacity:1}
  .sky svg circle{animation:glow 3.2s ease-in-out infinite}
}
/* bands (site-kit) */
.band{position:relative;isolation:isolate;margin:40px 0 20px;width:100%;min-height:clamp(300px,58vh,560px);display:grid;align-items:end;
  background-size:cover;background-position:center;background-attachment:fixed;background-color:#0d0b1f;color:#fff;text-decoration:none}
.band::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(13,11,31,.35) 0%,rgba(13,11,31,.1) 40%,rgba(13,11,31,.9) 100%)}
.band::after{content:"";position:absolute;inset:0;z-index:-1;mix-blend-mode:multiply;background:radial-gradient(120% 90% at 20% 80%,rgba(210,58,112,.3),transparent 60%)}
.band .in{max-width:1100px;margin:0 auto;padding:28px 16px 34px;width:100%}
.band h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,7vw,4rem);line-height:1;margin:0 0 8px;text-shadow:0 2px 26px rgba(0,0,0,.5)}
.band p{margin:0;max-width:38ch;font-size:1.08rem;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.band .kicker{color:#ffe3a3}
.band .cred{position:absolute;right:0;bottom:0;background:rgba(13,11,31,.7);color:#cfc8e6;padding:2px 8px;margin:0;max-width:70%}
@media (pointer:coarse),(prefers-reduced-motion:reduce){.band{background-attachment:scroll}}

/* loop */
.loopwrap{display:grid;gap:18px}
@media (min-width:860px){.loopwrap{grid-template-columns:1.3fr 1fr;align-items:start}}
.loopmap{width:100%;height:auto;display:block;border-radius:18px;box-shadow:var(--shadow)}
.lm-bg{fill:var(--bg2)}
.lm-water{fill:var(--water)}
.lm-street{fill:none;stroke:var(--street);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.lm-minor{fill:none;stroke:var(--road);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.lm-major{fill:none;stroke:var(--road2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lm-route{fill:none;stroke:var(--lotus);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:0}
.lm-route-glow{fill:none;stroke:var(--gold-hi);stroke-width:9;opacity:.5;stroke-linecap:round;stroke-linejoin:round}
.lm-stop circle{fill:var(--ink);stroke:var(--gold-hi);stroke-width:2.5}
.lm-stop text{fill:var(--bg);font:700 12px var(--body);text-anchor:middle}
.lm-stop:hover circle,.lm-stop:focus circle{fill:var(--lotus)}
@media (prefers-reduced-motion:no-preference){
  .loopmap.draw .lm-route{animation:drawroute 4.5s cubic-bezier(.45,.05,.3,1) both}
  @keyframes drawroute{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
}
.stops{list-style:none;margin:0;padding:0;counter-reset:s}
.stops li{counter-increment:s;display:grid;grid-template-columns:30px 54px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.stops li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.stops img{width:54px;height:40px;object-fit:cover;border-radius:8px}
.stops a{text-decoration:none;font-weight:600;line-height:1.3}
.stops .leg{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* footer */
footer{margin-top:40px;background:var(--bg2);border-top:1px solid var(--line);padding:30px 0 110px;font-size:.86rem;color:var(--muted)}
footer h3{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
footer p{max-width:72ch;margin:0 0 8px}
footer dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0 0 12px;max-width:520px}
footer dd{margin:0;font-variant-numeric:tabular-nums;color:var(--ink)}
.credits{columns:2 260px;column-gap:24px;font-size:.74rem;line-height:1.45}
.credits div{break-inside:avoid;margin-bottom:5px}

/* ---------- bottom nav (Grab-like) ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:4px;padding:6px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;white-space:nowrap;border-radius:999px;text-decoration:none;font-size:.7rem;min-width:62px;color:var(--muted)}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none}
.panel.open{display:block}
@media (prefers-reduced-motion:no-preference){.panel.open{animation:rise .38s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(24px)}}}
.phead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.phead .t{font-weight:700;font-size:1.05rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:inherit;color:inherit}
.lhero{position:relative;isolation:isolate;min-height:190px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,var(--c,#2b2272),#0d0b1f)}
.lhero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:.85}
.lhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent,rgba(13,11,31,.88))}
.lhero .in{padding:18px 16px;max-width:1100px;margin:0 auto;width:100%}
.lhero h2{font-family:var(--serif);font-size:2.3rem;line-height:1.05;margin:0}
.lhero .k{font-family:var(--khmer)}
.lhero .cred{color:#d9d3ee}
.ltools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.ltools select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:8px 14px;min-height:42px}
.count{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c,#8c86a0);grid-row:span 2}
.row .dot .ico{width:20px;height:20px}
.row .nm{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row .mt{font-size:.82rem;color:var(--muted);line-height:1.45;grid-column:2;overflow-wrap:anywhere}
.row .side{grid-column:3;grid-row:1/span 2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .d{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--c,var(--gold))}
.row:hover{background:var(--bg2)}
.ride{display:inline-flex;align-items:center;gap:6px;background:var(--jade);color:var(--jade-ink);font-weight:700;border-radius:999px;padding:7px 14px;text-decoration:none;font-size:.88rem;min-height:40px;border:0;cursor:pointer}
.ride .ico{width:18px;height:18px}
.ride.big{padding:12px 22px;font-size:1rem;min-height:50px}
@media (prefers-reduced-motion:no-preference){.ride{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ride:hover{transform:scale(1.05)}.ride:active{transform:scale(.95)}}
.showmore{display:block;margin:18px auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 22px;cursor:pointer;min-height:46px}
.empty{padding:30px 6px;color:var(--muted);max-width:52ch}

/* sheet */
.scrimall{position:fixed;inset:0;z-index:60;background:rgba(8,6,20,.5);display:none;backdrop-filter:blur(2px)}
.scrimall.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.35);
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px}
.sheet .in{padding:6px 18px 12px}
.sheet h2{font-size:1.45rem;line-height:1.25;margin:4px 0 2px;overflow-wrap:anywhere}
.sheet .mt{color:var(--muted);font-size:.9rem}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sheet canvas{width:100%;height:210px;display:block;border-radius:16px;margin:8px 0;background:var(--bg2)}

.sheet .close{position:absolute;right:14px;top:12px}

.lmhero .cred{color:#cfc8e6;position:absolute;right:8px;bottom:4px;max-width:60%;text-align:right}

.lmbody .txt{font-size:1.12rem;max-width:58ch}
.lmbody .txt2{color:var(--muted);max-width:58ch}

/* map */
#mappanel{overflow:hidden}
#bigmap{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--bg2)}
#mappanel .phead{position:absolute;left:0;right:0;top:0}

.maptip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:3px 10px;border-radius:999px;transform:translate(-50%,-150%);white-space:nowrap;opacity:0;transition:opacity .15s}

  radial-gradient(circle at 11px 11px,var(--gold) 2.2px,transparent 2.8px) 0 0/22px 22px repeat-x,
  linear-gradient(90deg,transparent,var(--gold) 12%,var(--gold) 88%,transparent) center/100% 1px no-repeat;opacity:.55}
@media print{.tabbar,#motes{display:none}}

sy.gov/notice-thailand-digital-arrival-card-system-set-to-launch-on-1-may-2025/"}]},{"t":"p","en":"Staying longer in Cambodia: a visitor visa (type T) extends once, by a month; a business (E) visa extends up to a year. Overstay is $10 a day.","th":"อยู่กัมพูชานานขึ้น วีซ่าท่องเที่ยวต่อได้ครั้งเดียว 1 เดือน วีซ่าธุรกิจ (E) ต่อได้ถึง 1 ปี อยู่เกินวันละ 10 ดอลลาร์","km":"ស្នាក់នៅយូរជាងនេះ៖ ទិដ្ឋាការទេសចរណ៍បន្តបានម្ដង 1 ខែ។ ទិដ្ឋាការអាជីវកម្ម (E) បន្តបានដល់ 1 ឆ្នាំ។ ស្នាក់លើស $10 ក្នុងមួយថ្ងៃ។","src":"https://www.tourismcambodia.com/tripplanner/essential-information/visa-passport.htm"},{"t":"p","en":"The US Embassy asks travellers to stay more than 50 km from the Thai–Cambodian border. Phnom Penh and Siem Reap town are well outside it.","th":"สถานทูตสหรัฐฯ แนะนำให้อยู่ห่างแนวชายแดนไทย–กัมพูชาเกิน 50 กม. พนมเปญและตัวเมืองเสียมราฐอยู่นอกระยะนั้น","km":"ស្ថានទូតអាមេរិកស្នើឱ្យនៅឆ្ងាយពីព្រំដែនថៃ–កម្ពុជាលើសពី 50 គ.ម។ ភ្នំពេញ និងទីក្រុងសៀមរាបនៅក្រៅចម្ងាយនោះ។","src":"https://kh.usembassy.gov/security-alert-cambodia-thailand-border/"}]},{"id":"air","icon":"i-plane","photo":"skyline","h":{"en":"The airport","th":"สนามบิน","km":"ព្រលានយន្តហោះ"},"blocks":[{"t":"p","en":"Phnom Penh's airport is new and far out. Techo International (code KTI, not the old PNH) opened on 9 September 2025, about 20 km south of the city; our road route to Central Market is 27 km.","th":"สนามบินพนมเปญเป็นสนามบินใหม่และอยู่ไกลเมือง เตโช (รหัส KTI ไม่ใช่ PNH แบบเดิม) เปิด 9 กันยายน 2568 อยู่ใต้เมืองราว 20 กม. ตามถนนถึงตลาดกลาง 27 กม.","km":"ព្រលានយន្តហោះភ្នំពេញថ្មី ហើយនៅឆ្ងាយ។ អាកាសយានដ្ឋានតេជោ (កូដ KTI មិនមែន PNH ចាស់) បើកថ្ងៃទី 9 កញ្ញា 2025 ប្រហែល 20 គ.ម ខាងត្បូងទីក្រុង។ តាមផ្លូវទៅផ្សារធំថ្មី 27 គ.ម។","src":"https://en.wikipedia.org/wiki/Techo_International_Airport"},{"t":"facts","rows":[{"k":{"en":"Airport bus","th":"รถบัสสนามบิน","km":"ឡានក្រុងព្រលាន"},"v":{"en":"05:30–23:30 daily, via the railway station (Canadia Garden) and Monivong Blvd. Fare reported as 1,500 riel.","th":"ทุกวัน 05:30–23:30 ผ่านสถานีรถไฟและถนนมุนีวงศ์ ค่าโดยสารราว 1,500 เรียล","km":"រៀងរាល់ថ្ងៃ 05:30–23:30 តាមស្ថានីយ៍រថភ្លើង និងមហាវិថីព្រះមុនីវង្ស។ តម្លៃប្រហែល 1,500 រៀល។"},"src":"https://www.techoairport.com.kh/transportation/public"},{"k":{"en":"Grab or taxi","th":"Grab หรือแท็กซี่","km":"Grab ឬតាក់ស៊ី"},"v":{"en":"About $10–21 to the centre, 30–60 minutes by traffic.","th":"ราว 10–21 ดอลลาร์ถึงใจกลางเมือง 30–60 นาที แล้วแต่รถติด","km":"ប្រហែល $10–21 ទៅកណ្ដាលក្រុង 30–60 នាទី អាស្រ័យលើចរាចរណ៍។"},"src":"https://cambopedia.com/how-to-get-from-techo-international-airport-to-phnom-penh/"},{"k":{"en":"On landing","th":"ลงเครื่องแล้ว","km":"ពេលចុះ"},"v":{"en":"SIM counters (Cellcard, Smart, Metfone) after baggage; bank ATMs in arrivals. Dollars work everywhere; riel is the change.","th":"เคาน์เตอร์ซิม (Cellcard, Smart, Metfone) หลังรับกระเป๋า มีตู้ ATM ที่ขาเข้า ใช้ดอลลาร์ได้ทุกที่ ทอนเป็นเรียล","km":"តូបស៊ីម (Cellcard, Smart, Metfone) ក្រោយយកឥវ៉ាន់ និង ATM នៅច្រកមកដល់។ ប្រើដុល្លារបានគ្រប់កន្លែង ប្រាក់អាប់ជារៀល។"},"src":"https://www.wingbank.com.kh/en/news/wing-atms-now-at-techo-international-airport"},{"k":{"en":"Siem Reap (SAI)","th":"เสียมราฐ (SAI)","km":"សៀមរាប (SAI)"},"v":{"en":"Also new (2023), about 50 km from town. Shuttle $8, car $35.","th":"ใหม่เหมือนกัน (2566) ห่างเมืองราว 50 กม. รถรับส่ง 8 ดอลลาร์ รถเหมา 35 ดอลลาร์","km":"ថ្មីដូចគ្នា (2023) ប្រហែល 50 គ.ម ពីទីក្រុង។ ឡានដឹក $8 ឡានឯកជន $35។"},"src":"https://www.siemreap.net/guides/travel/siem-reap-angkor-international-airport/"}]},{"t":"ride","lat":11.362917,"lng":104.916611,"name":"Techo International Airport"}]},{"id":"fly","icon":"i-route","photo":"hero-night","h":{"en":"Flying in and out","th":"บินไป บินกลับ","km":"ហោះទៅ ហោះមក"},"blocks":[{"t":"region"},{"t":"p","en":"No airline flies Chiang Mai or Chiang Rai to Cambodia nonstop. Change in Bangkok: Suvarnabhumi (Thai, Bangkok Airways, Air Cambodia and others) or Don Mueang (Thai AirAsia). Bangkok to Phnom Penh is about 1 h 10.","th":"ไม่มีเที่ยวบินตรงจากเชียงใหม่หรือเชียงรายไปกัมพูชา ต่อเครื่องที่กรุงเทพฯ สุวรรณภูมิ (การบินไทย บางกอกแอร์เวย์ส แอร์กัมพูชา ฯลฯ) หรือดอนเมือง (ไทยแอร์เอเชีย) กรุงเทพฯ–พนมเปญราว 1 ชม. 10 นาที","km":"គ្មានជើងហោះត្រង់ពីឈៀងម៉ៃ ឬឈៀងរ៉ាយទៅកម្ពុជាទេ។ ប្ដូរយន្តហោះនៅបាងកក៖ សុវណ្ណភូមិ ឬដុនមឿង។ បាងកកទៅភ្នំពេញប្រហែល 1 ម៉ោង 10 នាទី។","src":"https://en.wikipedia.org/wiki/Chiang_Mai_International_Airport"},{"t":"p","en":"Siem Reap flies straight to Bangkok: Bangkok Airways three times a day (07:40, 10:55, 17:35, about 1 h 20), Thai AirAsia to Don Mueang, Thai, and from 15 September 2026 Cambodia Airways.","th":"เสียมราฐบินตรงกรุงเทพฯ ได้ บางกอกแอร์เวย์สวันละ 3 เที่ยว (07:40, 10:55, 17:35 ราว 1 ชม. 20 นาที) ไทยแอร์เอเชียไปดอนเมือง การบินไทย และแคมโบเดียแอร์เวย์สตั้งแต่ 15 ก.ย. 2569","km":"សៀមរាបហោះត្រង់ទៅបាងកក៖ Bangkok Airways 3 ដងក្នុងមួយថ្ងៃ (07:40, 10:55, 17:35 ប្រហែល 1 ម៉ោង 20 នាទី) Thai AirAsia ទៅដុនមឿង និង Cambodia Airways ចាប់ពី 15 កញ្ញា 2026។","src":["https://www.bangkokair.com/flightdeals/view/siem-reap","https://www.aeroroutes.com/eng/260901-krsep26sai"]},{"t":"facts","rows":[{"k":{"en":"Phnom Penh → Siem Reap by bus","th":"พนมเปญ → เสียมราฐ รถบัส","km":"ភ្នំពេញ → សៀមរាប ឡានក្រុង"},"v":{"en":"About 6 h, from about $10 (Giant Ibis from the Night Market, Larryta, night buses with bunks). 313 km by road; no expressway yet.","th":"ราว 6 ชม. เริ่มราว 10 ดอลลาร์ (Giant Ibis จากตลาดกลางคืน, Larryta, รถนอน) ถนน 313 กม. ยังไม่มีทางด่วน","km":"ប្រហែល 6 ម៉ោង ចាប់ពីប្រហែល $10 (Giant Ibis ពីផ្សាររាត្រី, Larryta, ឡានយប់មានគ្រែ)។ ផ្លូវ 313 គ.ម មិនទាន់មានផ្លូវល្បឿនលឿនទេ។"},"src":"https://www.giantibis.com/routes/phnom-penh-to-siem-reap"},{"k":{"en":"Phnom Penh → Siem Reap by air","th":"พนมเปญ → เสียมราฐ เครื่องบิน","km":"ភ្នំពេញ → សៀមរាប យន្តហោះ"},"v":{"en":"About 55 minutes (Air Cambodia, AirAsia Cambodia, Cambodia Airways 09:00 and 12:50).","th":"ราว 55 นาที (แอร์กัมพูชา แอร์เอเชียกัมพูชา แคมโบเดียแอร์เวย์ส 09:00 และ 12:50)","km":"ប្រហែល 55 នាទី (Air Cambodia, AirAsia Cambodia, Cambodia Airways ម៉ោង 09:00 និង 12:50)។"},"src":"https://www.aeroroutes.com/eng/260617-krjun26sai"}]}]},{"id":"stay","icon":"i-cal","photo":"bayon","h":{"en":"How long, and Siem Reap?","th":"อยู่กี่วัน ไปเสียมราฐดีไหม","km":"ស្នាក់ប៉ុន្មានថ្ងៃ ទៅសៀមរាបឬទេ?"},"blocks":[{"t":"cards","cards":[{"k":{"en":"3 nights","th":"3 คืน","km":"3 យប់"},"h":{"en":"Phnom Penh only","th":"พนมเปญอย่างเดียว","km":"តែភ្នំពេញ"},"p":{"en":"Day one the palace, the museum and the river loop; day two the markets and a spa; day three Wat Phnom at dawn and whatever you missed. Fly in and out of KTI.","th":"วันแรกพระราชวัง พิพิธภัณฑ์ และวนริมน้ำ วันที่สองตลาดกับสปา วันที่สามวัดพนมตอนเช้าและที่ยังไม่ได้ไป เข้าออกทาง KTI","km":"ថ្ងៃទី1 វាំង សារមន្ទីរ និងដំណើរមាត់ទន្លេ។ ថ្ងៃទី2 ផ្សារ និងស្ប៉ា។ ថ្ងៃទី3 វត្តភ្នំពេលព្រឹក។ ចេញចូលតាម KTI។"}},{"k":{"en":"5 nights · half a leg","th":"5 คืน · ครึ่งขา","km":"5 យប់ · ពាក់កណ្ដាលជើង"},"h":{"en":"In by Phnom Penh, out by Siem Reap","th":"เข้าพนมเปญ ออกเสียมราฐ","km":"ចូលតាមភ្នំពេញ ចេញតាមសៀមរាប"},"hot":true,"p":{"en":"Three nights in Phnom Penh, bus or fly north, two nights in Siem Reap, then fly SAI straight to Bangkok. No backtracking. Buy a one-day Angkor pass ($37) dated for your full day: it lets you in from 16:45 the afternoon before, so you get a sunset and a sunrise.","th":"พนมเปญ 3 คืน นั่งรถหรือบินขึ้นเหนือ เสียมราฐ 2 คืน แล้วบินจาก SAI ตรงกรุงเทพฯ ไม่ต้องย้อนกลับ ซื้อบัตรนครวัด 1 วัน (37 ดอลลาร์) ลงวันที่ของวันเที่ยวเต็มวัน เข้าได้ตั้งแต่ 16:45 ของวันก่อน ได้ทั้งตะวันตกและตะวันขึ้น","km":"ភ្នំពេញ 3 យប់ ជិះឡានក្រុង ឬហោះទៅខាងជើង សៀមរាប 2 យប់ រួចហោះពី SAI ត្រង់ទៅបាងកក។ មិនបាច់ត្រឡប់ក្រោយ។ ទិញសំបុត្រអង្គរ 1 ថ្ងៃ ($37) សម្រាប់ថ្ងៃពេញ៖ ចូលបានពីម៉ោង 16:45 ល្ងាចមុន ឃើញទាំងថ្ងៃលិច និងថ្ងៃរះ។"},"src":["https://www.siemreap.net/guides/angkor/hours-admission/","https://www.bangkokair.com/flightdeals/view/siem-reap"]},{"k":{"en":"6–7 nights · the whole leg","th":"6–7 คืน · เต็มขา","km":"6–7 យប់ · ពេញជើង"},"h":{"en":"Three and three","th":"สามคืนกับสามคืน","km":"បីយប់ និងបីយប់"},"p":{"en":"Three nights each, the three-day Angkor pass ($62, use within 7 days). Worth it if the temples are why you came; the far ones (Banteay Srei, Beng Mealea) need the extra day.","th":"เมืองละ 3 คืน บัตรนครวัด 3 วัน (62 ดอลลาร์ ใช้ภายใน 7 วัน) คุ้มถ้ามาเพราะปราสาท ปราสาทไกลๆ (บันทายศรี เบงเมเลีย) ต้องใช้วันเพิ่ม","km":"ក្រុងនីមួយៗ 3 យប់ សំបុត្រអង្គរ 3 ថ្ងៃ ($62 ប្រើក្នុង 7 ថ្ងៃ)។ សមនឹងទៅបើអ្នកមកដើម្បីប្រាសាទ។"},"src":"https://www.siemreap.net/guides/angkor/hours-admission/"}]},{"t":"photo","slug":"angkor-sunrise","en":"Sunrise at Angkor Wat","th":"ตะวันขึ้นที่นครวัด","km":"ថ្ងៃរះនៅអង្គរវត្ត"},{"t":"photo","slug":"ta-prohm","en":"Ta Prohm, where the trees hold the stones","th":"ตาพรหม ที่รากไม้โอบหิน","km":"តាព្រហ្ម ដែលឫសឈើឱបថ្ម"},{"t":"p","en":"Our pick for a first trip from Chiang Mai: the half leg. It costs one domestic hop or a $10 bus, and saves the flight back through Phnom Penh.","th":"ถ้ามาครั้งแรกจากเชียงใหม่ เราเลือกแบบครึ่งขา เพิ่มแค่เที่ยวบินในประเทศหรือรถบัส 10 ดอลลาร์ และไม่ต้องบินย้อนผ่านพนมเปญ","km":"ការជ្រើសរើសរបស់យើងសម្រាប់ដំណើរដំបូងពីឈៀងម៉ៃ៖ ពាក់កណ្ដាលជើង។ ចំណាយតែជើងហោះក្នុងស្រុក ឬឡានក្រុង $10 ហើយមិនបាច់ហោះត្រឡប់តាមភ្នំពេញ។"}]},{"id":"prices","icon":"i-coin","photo":"fruit","h":{"en":"Prices: Phnom Penh and Chiang Mai","th":"ราคา พนมเปญกับเชียงใหม่","km":"តម្លៃ ភ្នំពេញ និងឈៀងម៉ៃ"},"blocks":[{"t":"p","en":"Phnom Penh prices in dollars, Chiang Mai in baht, both turned into one currency at the 29 September rate ($1 = ฿33.57 = 4,056 riel). Food and rent come from Numbeo, which people fill in themselves.","th":"พนมเปญคิดเป็นดอลลาร์ เชียงใหม่เป็นบาท แปลงเป็นสกุลเดียวที่อัตรา 29 กันยายน (1 ดอลลาร์ = 33.57 บาท = 4,056 เรียล) ราคาอาหารและค่าเช่ามาจาก Numbeo ที่ผู้ใช้กรอกเอง","km":"តម្លៃភ្នំពេញជាដុល្លារ ឈៀងម៉ៃជាបាត ប្ដូរជារូបិយប័ណ្ណតែមួយតាមអត្រា 29 កញ្ញា ($1 = ฿33.57 = 4,056 រៀល)។ តម្លៃម្ហូប និងជួលផ្ទះមកពី Numbeo ដែលអ្នកប្រើបំពេញខ្លួនឯង។","src":["https://www.nbc.gov.kh/english/economic_research/exchange_rate.php","https://api.frankfurter.dev/v1/latest?base=USD&symbols=THB","https://www.numbeo.com/cost-of-living/in/Phnom-Penh","https://www.numbeo.com/cost-of-living/in/Chiang-Mai"]},{"t":"cards","cards":[{"k":{"en":"Cheaper in Chiang Mai","th":"ถูกกว่าที่เชียงใหม่","km":"ថោកជាងនៅឈៀងម៉ៃ"},"h":{"en":"Food, coffee, fuel, rent","th":"อาหาร กาแฟ น้ำมัน ค่าเช่า","km":"ម្ហូប កាហ្វេ សាំង ជួលផ្ទះ"},"hot":true,"p":{"en":"A cheap meal costs about half, a cappuccino 40% less. Diesel is cheaper in Thailand. A central one-bedroom rents for less in Chiang Mai than in Phnom Penh.","th":"อาหารจานถูกราคาราวครึ่งเดียว คาปูชิโนถูกกว่า 40% ดีเซลไทยถูกกว่า ห้องหนึ่งห้องนอนกลางเมืองเชียงใหม่ถูกกว่าพนมเปญ","km":"អាហារថោកតម្លៃប្រហែលពាក់កណ្ដាល កាពូឈីណូថោកជាង 40%។ ម៉ាស៊ូតនៅថៃថោកជាង។ ផ្ទះមួយបន្ទប់កណ្ដាលក្រុងឈៀងម៉ៃថោកជាងភ្នំពេញ។"}},{"k":{"en":"Cheaper in Phnom Penh","th":"ถูกกว่าที่พนมเปญ","km":"ថោកជាងនៅភ្នំពេញ"},"h":{"en":"Draught beer, cigarettes, cash","th":"เบียร์สด บุหรี่ กดเงิน","km":"ស្រាបៀរស្រស់ បារី ដកប្រាក់"},"p":{"en":"Draught beer is about half the Chiang Mai price and a pack of Marlboro less than half. A foreign-card ATM withdrawal costs less than at a Thai bank.","th":"เบียร์สดราคาราวครึ่งหนึ่งของเชียงใหม่ มาร์ลโบโรไม่ถึงครึ่ง กดเงินด้วยบัตรต่างประเทศถูกกว่าตู้ธนาคารไทย","km":"ស្រាបៀរស្រស់តម្លៃប្រហែលពាក់កណ្ដាលនៃឈៀងម៉ៃ ម៉ាលបូរ៉ូតិចជាងពាក់កណ្ដាល។ ដកប្រាក់ដោយកាតបរទេសថោកជាងធនាគារថៃ។"}},{"k":{"en":"Dollars","th":"ดอลลาร์","km":"ដុល្លារ"},"h":{"en":"Priced in dollars, changed in riel","th":"ตั้งราคาเป็นดอลลาร์ ทอนเป็นเรียล","km":"តម្លៃជាដុល្លារ អាប់ជារៀល"},"p":{"en":"Restaurants, visas, SIMs and the Angkor pass are priced in US dollars. Fuel, electricity and Grab tuk-tuks run in riel.","th":"ร้านอาหาร วีซ่า ซิม และบัตรนครวัดตั้งราคาเป็นดอลลาร์ น้ำมัน ไฟฟ้า และตุ๊กตุ๊ก Grab คิดเป็นเรียล","km":"ភោជនីយដ្ឋាន ទិដ្ឋាការ ស៊ីម និងសំបុត្រអង្គរ គិតជាដុល្លារ។ សាំង អគ្គិសនី និងរ៉ឺម៉ក Grab គិតជារៀល។"}}]},{"t":"prices"}]},{"id":"naga","icon":"i-water","photo":"hero-dusk","h":{"en":"Nagas: Khmer and Thai","th":"นาค เขมรกับไทย","km":"នាគ ខ្មែរ និងថៃ"},"blocks":[{"t":"photo","slug":"wat-phnom","en":"The naga stair at Wat Phnom","th":"บันไดนาควัดพนม","km":"ជណ្ដើរនាគវត្តភ្នំ"},{"t":"p","en":"Both countries keep the naga at the water, the stair and the door. The stories they tell about it are different, and so is the body.","th":"ทั้งสองประเทศมีนาคอยู่ที่น้ำ ที่บันได ที่ประตู แต่เรื่องเล่าต่างกัน รูปร่างก็ต่างกัน","km":"ប្រទេសទាំងពីរមាននាគនៅទឹក នៅជណ្ដើរ និងនៅទ្វារ។ តែរឿងនិទាន និងរូបរាងខុសគ្នា។"},{"t":"h","en":"Where the naga comes from","th":"นาคมาจากไหน","km":"នាគមកពីណា"},{"t":"cards","cards":[{"k":{"en":"Khmer","th":"เขมร","km":"ខ្មែរ"},"h":{"en":"The naga is family","th":"นาคคือญาติ","km":"នាគជាញាតិ"},"hot":true,"p":{"en":"Preah Thong, a prince from over the sea, marries Neang Neak, the naga king's daughter. The naga king drinks the sea to make land for them: Kampuchea. Khmer read themselves as the children of that marriage.","th":"พระทอง เจ้าชายจากโพ้นทะเล แต่งงานกับนางนาค ธิดาพญานาค พญานาคดื่มน้ำทะเลจนเกิดแผ่นดินให้ทั้งสอง คือกัมพูชา ชาวเขมรถือว่าตนเป็นลูกหลานของการแต่งงานครั้งนั้น","km":"ព្រះថោង ជាព្រះរាជបុត្រមកពីក្រៅសមុទ្រ រៀបការជាមួយនាងនាគ បុត្រីស្ដេចនាគ។ ស្ដេចនាគផឹកទឹកសមុទ្រ ធ្វើជាដីឱ្យពួកគេ៖ កម្ពុជា។ ខ្មែរចាត់ទុកខ្លួនជាកូនចៅនៃអាពាហ៍ពិពាហ៍នោះ។"},"src":"https://asianethnology.org/article/148920-kaundinya-preah-thaong-and-the-nagi-soma-some-aspects-of-a-cambodian-legend.pdf"},{"k":{"en":"Thai and Lanna","th":"ไทยและล้านนา","km":"ថៃ និងឡាន់ណា"},"h":{"en":"The naga is a guardian","th":"นาคคือผู้พิทักษ์","km":"នាគជាអ្នកការពារ"},"p":{"en":"Mucalinda coils seven times around the Buddha and spreads his hood through a seven-day storm. In the north, a naga drowns the city of Yonok after its people eat a great white eel from the Mekong.","th":"พญามุจลินท์ขดเจ็ดรอบองค์พระพุทธเจ้า แผ่พังพานกันพายุเจ็ดวัน ทางเหนือ พญานาคถล่มเมืองโยนกให้จมน้ำ หลังชาวเมืองกินปลาไหลเผือกตัวใหญ่จากแม่น้ำโขง","km":"មុចលិន្ទនាគរាជ ព័ទ្ធព្រះពុទ្ធ 7 ជុំ ហើយបាំងពពែកការពារព្យុះ 7 ថ្ងៃ។ នៅភាគខាងជើង នាគបានលិចក្រុងយោនក ក្រោយអ្នកក្រុងស៊ីអន្ទង់សដ៏ធំពីទន្លេមេគង្គ។"},"src":["https://www.accesstoinsight.org/tipitaka/kn/ud/ud.2.01.irel.html","http://www.asianscholarship.org/asf/ejourn/articles/Phan%20Anh%20Tu3.pdf"]}]},{"t":"h","en":"What it looks like","th":"หน้าตาเป็นอย่างไร","km":"រូបរាងយ៉ាងដូចម្ដេច"},{"t":"cards","cards":[{"k":{"en":"Khmer","th":"เขมร","km":"ខ្មែរ"},"h":{"en":"A fan of heads, in stone","th":"หัวแผ่เป็นพัด ทำด้วยหิน","km":"ក្បាលលាតដូចផ្លិត ធ្វើពីថ្ម"},"p":{"en":"Five, seven or nine heads open like a hood, the body laid flat along a causeway. The stone naga balustrade starts in Khmer temples, first at Bakong in the 9th century. At Angkor Thom gods and demons pull the naga to churn the sea of milk.","th":"หัวห้า เจ็ด หรือเก้าหัวแผ่เป็นพังพาน ตัววางยาวตามทางเดิน ราวบันไดนาคหินเริ่มที่ปราสาทเขมร ครั้งแรกที่บากองในศตวรรษที่ 9 ที่นครธม เทวดากับอสูรดึงนาคกวนเกษียรสมุทร","km":"ក្បាល 5 7 ឬ 9 លាតដូចពពែក ខ្លួនដេកលាតតាមផ្លូវ។ បង្កាន់ដៃនាគថ្មចាប់ផ្ដើមនៅប្រាសាទខ្មែរ ដំបូងនៅបាគង សតវត្សទី 9។ នៅអង្គរធំ ទេវតា និងអសុរទាញនាគកូរសមុទ្រទឹកដោះ។"},"src":["https://www.ncpedia.org/media/seven-headed-serpent-forming","https://smarthistory.org/angkor-thom/"]},{"k":{"en":"Thai","th":"ไทย","km":"ថៃ"},"h":{"en":"Out of the makara's mouth","th":"ออกมาจากปากมกร","km":"ចេញពីមាត់មករ"},"p":{"en":"On temple stairs the naga pours from the jaws of a makara, a water beast. The roof itself is naga: the bargeboards ripple like its body and end in a raised head.","th":"ที่บันไดวัด นาคพุ่งออกจากปากมกร สัตว์น้ำในตำนาน หลังคาก็เป็นนาค ลำยองพลิ้วเหมือนตัวนาค ปลายเป็นหางหงส์ชูหัวขึ้น","km":"នៅជណ្ដើរវត្ត នាគចេញពីមាត់មករ សត្វទឹក។ ដំបូលក៏ជានាគដែរ៖ ក្ដារគែមរលកដូចខ្លួននាគ ចុងជាក្បាលលើក។"},"src":"http://www.asianscholarship.org/asf/ejourn/articles/Phan%20Anh%20Tu3.pdf"},{"k":{"en":"Lanna","th":"ล้านนา","km":"ឡាន់ណា"},"h":{"en":"Crests, and sometimes wings","th":"มีหงอน บางตัวมีปีก","km":"មានក្បាំង ពេលខ្លះមានស្លាប"},"p":{"en":"Doi Suthep's long stair is two many-headed nagas spilling from makara. Northern roofs also carry the tua luang, a winged serpent that never comes out of a makara.","th":"บันไดยาวดอยสุเทพคือนาคหลายเศียรสองตัวที่ออกจากปากมกร หลังคาทางเหนือยังมี “ตัวลวง” งูมีปีกที่ไม่เคยออกจากปากมกร","km":"ជណ្ដើរវែងនៅដូយសុទេព គឺនាគច្រើនក្បាលពីរ ចេញពីមាត់មករ។ ដំបូលខាងជើងមាន “តួលួង” ពស់មានស្លាប ដែលមិនចេញពីមករ។"},"src":["http://www.asianscholarship.org/asf/ejourn/articles/Phan%20Anh%20Tu3.pdf","https://blog.bangkokair.com/en/wat-phra-that-doi-suthep-chiang-mai/"]}]},{"t":"h","en":"What people do with it","th":"คนทำอะไรกับนาค","km":"មនុស្សធ្វើអ្វីជាមួយនាគ"},{"t":"cards","cards":[{"k":{"en":"Khmer","th":"เขมร","km":"ខ្មែរ"},"h":{"en":"A wedding re-told","th":"งานแต่งเล่าเรื่องซ้ำ","km":"ពិធីរៀបការនិទានឡើងវិញ"},"p":{"en":"At a Khmer wedding the groom holds the bride's sash and follows her, as Preah Thong followed Neang Neak down into the naga realm. Neak ta, the land spirits, are a different word and a different being.","th":"ในงานแต่งเขมร เจ้าบ่าวจับผ้าสไบเจ้าสาวเดินตาม เหมือนพระทองตามนางนาคลงสู่เมืองนาค ส่วน “เนียะตา” ผีเจ้าที่ เป็นคนละคำ คนละตน","km":"នៅពិធីរៀបការខ្មែរ កូនកំលោះកាន់ស្បៃកូនក្រមុំដើរតាម ដូចព្រះថោងតាមនាងនាគចុះទៅនគរនាគ។ អ្នកតា ជាពាក្យផ្សេង និងជាអង្គផ្សេង។"},"src":["https://asianethnology.org/article/148920-kaundinya-preah-thaong-and-the-nagi-soma-some-aspects-of-a-cambodian-legend.pdf","https://www.tandfonline.com/doi/abs/10.1080/14442213.2018.1553205"]},{"k":{"en":"Thai","th":"ไทย","km":"ថៃ"},"h":{"en":"Fireballs, lottery, ordination","th":"บั้งไฟ หวย บวช","km":"បាល់ភ្លើង ឆ្នោត បួស"},"p":{"en":"At the end of Buddhist Lent the Mekong sends up the naga's fireballs. People ask Phaya Nak for lottery numbers. A man waiting to be ordained is called nak, after the naga who once took human form to become a monk. Since 2022 the naga is Thailand's national mythical creature.","th":"วันออกพรรษามีบั้งไฟพญานาคขึ้นจากแม่น้ำโขง คนขอหวยจากพญานาค ผู้ที่รอบวชเรียกว่า “นาค” ตามนาคที่แปลงเป็นคนมาขอบวช ตั้งแต่ปี 2565 นาคเป็นสัตว์ในตำนานประจำชาติไทย","km":"ថ្ងៃចេញព្រះវស្សា ទន្លេមេគង្គបញ្ចេញបាល់ភ្លើងនាគ។ មនុស្សសុំលេខឆ្នោតពីនាគ។ អ្នករង់ចាំបួសហៅថា “នាគ” តាមនាគដែលប្រែជាមនុស្សមកបួស។ ចាប់ពីឆ្នាំ 2022 នាគជាសត្វទេវកថាជាតិថៃ។"},"src":["https://thailandfoundation.or.th/ok-phansa-the-end-of-buddhist-lent/","https://www.nationthailand.com/thailand/general/40021635"]}]},{"t":"h","en":"Nagas in Phnom Penh","th":"นาคในพนมเปญ","km":"នាគនៅភ្នំពេញ"},{"t":"p","en":"The east stair of Wat Phnom; the naga heads on the five tiers of the Independence Monument; the Naga Fountain in the garden beside it. In 1892 a Naga Bridge crossed the canal south of Wat Phnom; the canal is gone. NagaWorld takes its name from a seven-headed naga the company says guards the rivers of the city.","th":"บันไดทิศตะวันออกของวัดพนม หัวนาคบนห้าชั้นของอนุสาวรีย์เอกราช น้ำพุนาคในสวนข้างๆ ปี 1892 มีสะพานนาคข้ามคลองทางใต้วัดพนม ตอนนี้คลองไม่มีแล้ว ส่วนนาคาเวิลด์ตั้งชื่อตามนาคเจ็ดเศียรที่บริษัทบอกว่าเฝ้าแม่น้ำของเมือง","km":"ជណ្ដើរខាងកើតវត្តភ្នំ ក្បាលនាគលើថ្នាក់ទាំង 5 នៃវិមានឯករាជ្យ និងទឹកពុលនាគក្នុងសួនក្បែរនោះ។ ឆ្នាំ 1892 មានស្ពាននាគឆ្លងព្រែកខាងត្បូងវត្តភ្នំ ព្រែកនោះលែងមានហើយ។ NagaWorld យកឈ្មោះតាមនាគ 7 ក្បាល ដែលក្រុមហ៊ុននិយាយថាការពារទន្លេរបស់ទីក្រុង។","src":["https://en.wikipedia.org/wiki/Independence_Monument_(Cambodia)","https://collection.efeo.fr/ws/web/app/collection/record/218309","https://www.nagaworld.com/nagaworld/"]}]},{"id":"spirits","icon":"i-home2","photo":"wat-ounalom","h":{"en":"Spirit houses: why the Khmer ones look empty","th":"ศาลพระภูมิ ทำไมศาลเขมรดูว่างเปล่า","km":"ផ្ទះអ្នកតា ហេតុអ្វីរបស់ខ្មែរមើលទៅទទេ"},"blocks":[{"t":"p","en":"In Thailand you buy a spirit house with its people: a guardian figure, servants, dancers, an elephant and a horse. In Cambodia the little house by the gate often holds only incense, fruit and a garland. The two houses are built for different beings.","th":"ในไทย ซื้อศาลพระภูมิมาพร้อมตุ๊กตา เจ้าที่ คนรับใช้ นางรำ ช้าง ม้า ในกัมพูชา ศาลเล็กๆ ข้างประตูมักมีแค่ธูป ผลไม้ และพวงมาลัย เพราะศาลสองแบบสร้างให้คนละตน","km":"នៅថៃ គេទិញផ្ទះព្រះភូមិមកជាមួយរូបតុក្កតា៖ អ្នកការពារ អ្នកបម្រើ អ្នករាំ ដំរី និងសេះ។ នៅកម្ពុជា ផ្ទះតូចក្បែរទ្វារច្រើនតែមានធូប ផ្លែឈើ និងកម្រងផ្កា។ ផ្ទះទាំងពីរសាងសង់សម្រាប់អង្គផ្សេងគ្នា។"},{"t":"cards","cards":[{"k":{"en":"Thai","th":"ไทย","km":"ថៃ"},"h":{"en":"A named god, with a court","th":"เทพมีชื่อ มีบริวาร","km":"ទេវតាមានឈ្មោះ មានបរិវារ"},"hot":true,"p":{"en":"The san phra phum, on one post, houses Phra Phum, one of nine sons a king sent to guard the land; Phra Chaimongkhon keeps houses and shops. He is shown as an image, so he gets servants, soldiers, elephants and horses. The lower san chao thi on four or more posts is for the ancestors and earlier owners of the land.","th":"ศาลพระภูมิเสาเดียวเป็นที่สถิตของพระภูมิ หนึ่งในโอรสเก้าองค์ที่ท้าวทศราชส่งไปเฝ้าแผ่นดิน พระชัยมงคลดูแลบ้านและร้านค้า ท่านมีรูป จึงมีบริวาร ทหาร ช้าง ม้า ส่วนศาลเจ้าที่ที่เตี้ยกว่า มีสี่เสาขึ้นไป เป็นที่อยู่ของบรรพบุรุษและเจ้าของที่เดิม","km":"ផ្ទះព្រះភូមិលើសសរមួយ ជាទីគង់របស់ព្រះភូមិ ជាបុត្រមួយក្នុងចំណោមប្រាំបួនដែលស្ដេចបញ្ជូនឱ្យការពារដី។ លោកមានរូប ដូច្នេះមានអ្នកបម្រើ ទាហាន ដំរី និងសេះ។ ផ្ទះទាបលើសសរ 4 ឬច្រើន សម្រាប់ដូនតា និងម្ចាស់ដីមុន។"},"src":["https://th.wikipedia.org/wiki/%E0%B8%A8%E0%B8%B2%E0%B8%A5%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A0%E0%B8%B9%E0%B8%A1%E0%B8%B4","https://baanlaesuan.com/279892/maintenance/spirit-house-difference"]},{"k":{"en":"Khmer","th":"เขมร","km":"ខ្មែរ"},"h":{"en":"The spirit is already there","th":"ผีอยู่ที่นั่นอยู่แล้ว","km":"អ្នកតានៅទីនោះរួចហើយ"},"p":{"en":"Neak ta, the owners of the land and water, live in a tree, a rock, a termite mound, an old piece of sculpture, or in no visible form. The hut shelters that place or receives the offerings; there is no image to put inside. A village keeps its neak ta a hut, often to the northeast; a household honours its tevoda with offerings in front.","th":"เนียะตา เจ้าของแผ่นดินและน้ำ อยู่ในต้นไม้ ก้อนหิน จอมปลวก ชิ้นประติมากรรมเก่า หรือไม่มีรูปให้เห็น ศาลมีไว้คุ้มที่นั้นหรือรับเครื่องเซ่น ไม่มีรูปให้ใส่ หมู่บ้านสร้างศาลให้เนียะตา มักทางทิศตะวันออกเฉียงเหนือ ในบ้านบูชาเทวดาโดยวางของไหว้ไว้ข้างหน้า","km":"អ្នកតា ជាម្ចាស់ដី និងទឹក នៅក្នុងដើមឈើ ថ្ម ដំបូក បំណែករូបចម្លាក់ចាស់ ឬគ្មានរូបមើលឃើញ។ ខ្ទមការពារកន្លែងនោះ ឬទទួលតង្វាយ គ្មានរូបដាក់ខាងក្នុងទេ។ ភូមិធ្វើខ្ទមអ្នកតា ច្រើននៅទិសឦសាន។ ក្នុងផ្ទះ គេគោរពទេវតាដោយដាក់តង្វាយពីមុខ។"},"src":["https://www.newmandala.org/the-desertion-of-cambodias-spirits/","https://www.aefek.fr/wa_files/angchoulean1.pdf","https://www.cambodgemag.com/en/post/cambodia-tradition-cambodian-spirit-houses"]},{"k":{"en":"Lanna","th":"ล้านนา","km":"ឡាន់ណា"},"h":{"en":"Closer to the Khmer way","th":"ใกล้แบบเขมร","km":"ជិតនឹងរបៀបខ្មែរ"},"p":{"en":"The san phra phum came late to the north. A northern house keeps a plain ho phi pu ya for its ancestors, facing east or north: a place to meet them, since they live in the upper realm, not a home to fill.","th":"ศาลพระภูมิมาถึงภาคเหนือทีหลัง บ้านล้านนามีหอผีปู่ย่าเรียบๆ หันทิศตะวันออกหรือทิศเหนือ เป็นที่พบบรรพบุรุษ เพราะท่านอยู่เมืองบน ไม่ใช่บ้านที่ต้องใส่ของให้เต็ม","km":"ផ្ទះព្រះភូមិមកដល់ភាគខាងជើងយឺត។ ផ្ទះនៅឡាន់ណាមានហោផីពូយ៉ាសាមញ្ញសម្រាប់ដូនតា បែរទៅទិសកើត ឬជើង៖ ជាកន្លែងជួប ព្រោះដូនតានៅស្ថានលើ មិនមែនជាផ្ទះដែលត្រូវដាក់ឱ្យពេញ។"},"src":["https://culture.lpru.ac.th/WebCulture2553/CultureKnowledge/file/06-01.pdf","https://th.wikipedia.org/wiki/%E0%B8%A8%E0%B8%B2%E0%B8%A5%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%A0%E0%B8%B9%E0%B8%A1%E0%B8%B4"]}]},{"t":"photo","slug":"spirit-thai","en":"A san phra phum and a san chao thi, Bangkok","th":"ศาลพระภูมิและศาลเจ้าที่ กรุงเทพฯ","km":"ផ្ទះព្រះភូមិ និងផ្ទះអ្នកតា បាងកក"},{"t":"photo","slug":"spirit-khmer","en":"The spirit house at Phnom Nham Lea","th":"ศาลที่พนมญำเลีย","km":"ខ្ទមអ្នកតា នៅ Phnom Nham Lea"}]},{"id":"teeth","icon":"i-health","photo":"riverside","h":{"en":"Teeth and oysters","th":"ทำฟันกับหอยนางรม","km":"ធ្មេញ និងងាវ"},"blocks":[{"t":"h","en":"Is Phnom Penh good for dentistry?","th":"พนมเปญทำฟันดีไหม","km":"ភ្នំពេញល្អសម្រាប់ព្យាបាលធ្មេញទេ?"},{"t":"p","en":"Patients fly in for it, mostly from Australia, Japan and Singapore. From Chiang Mai the saving mostly disappears: cleanings, fillings and root canals cost about the s   if(window.PP_CORE){ var C=window.PP_CORE; BASEG.streets=dec(C,C.streets); BASEG.parks=dec(C,C.parks); BASEG.wats=dec(C,C.wats); }
  return BASEG;
}
function riverSeasonUp(){ var mo=ppNow().getMonth()+1; return mo>=6 && mo<=10; }

var RIVERS = [
 {id:"tonle", w:.0017, gold:true, pts:[[104.9115,11.63],[104.9178,11.6192],[104.92104,11.6066],[104.9205,11.5922],[104.925,11.5814],[104.9322,11.5706],[104.9376,11.5616],[104.9412,11.5571]]},

 {id:"mekongS", w:.0048, pts:[[104.9475,11.5544],[104.9574,11.5508],[104.9736,11.5454],[104.9916,11.549],[105.01986,11.5508]]},
 {id:"bassac", w:.0012, pts:[[104.9412,11.5544],[104.9376,11.5454],[104.9331,11.5382],[104.934,11.5256],[104.9394,11.5112],[104.9457,11.4932],[104.9511,11.48006]]}

function river(){
  var cv=$("rivercv"), ctx=cv.getContext("2d"), g=baseDecode(), dpr=Math.min(2,window.devicePixelRatio||1);
  var box={w:104.900,e:104.980,s:11.520,n:11.612}, W0,H0,sc,ox,oy, water, baseCv, parts=[];
  var up=riverSeasonUp();
  function proj(o,a){ return [ox+(o-box.w)*KX*sc, oy+(box.n-a)*sc]; }
  var lines = RIVERS.map(function(rv){
    var segs=[], total=0;
    for(var i=1;i<rv.pts.length;i++){ var a=rv.pts[i-1], b=rv.pts[i], L=Math.hypot((b[0]-a[0])*KX,b[1]-a[1]); segs.push([a,b,total,L]); total+=L; }
    var dir = rv.id==="tonle" ? (up?-1:1) : 1;
    return {rv:rv, segs:segs, len:total, dir:dir};
  });
  function at(l,t){ var d=t*l.len; for(var i=0;i<l.segs.length;i++){ var s=l.segs[i]; if(d<=s[2]+s[3]||i===l.segs.length-1){ var k=(d-s[2])/s[3]; var o=s[0][0]+(s[1][0]-s[0][0])*k, a=s[0][1]+(s[1][1]-s[0][1])*k;
      var nx=-(s[1][1]-s[0][1]), ny=(s[1][0]-s[0][0])*KX, nl=Math.hypot(nx,ny)||1; return [o,a,nx/nl,ny/nl]; } } }
  function spawn(q,fresh){ var l=lines[q.li]; q.t = fresh ? Math.random() : (l.dir>0?0:1); q.off=(Math.random()*2-1)*.8; q.sp=(.6+Math.random()*.6)/l.len*.00006; }

    W0=cv.clientWidth; H0=cv.clientHeight; if(!W0||!H0) return;
    cv.width=W0*dpr; cv.height=H0*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    sc=Math.max(W0/((box.e-box.w)*KX), H0/(box.n-box.s)); ox=(W0-(box.e-box.w)*KX*sc)/2; oy=(H0-(box.n-box.s)*sc)/2;
    water=new Path2D();
    g.water.forEach(function(a){ for(var i=0;i<a.length;i+=2){ var p=proj(a[i],a[i+1]); if(i) water.lineTo(p[0],p[1]); else water.moveTo(p[0],p[1]); } water.closePath(); });
    baseCv=document.createElement("canvas"); baseCv.width=cv.width; baseCv.height=cv.height;
    var b=baseCv.getContext("2d"); b.setTransform(dpr,0,0,dpr,0,0);
    b.fillStyle="#0b1626"; b.fillRect(0,0,W0,H0);
    b.strokeStyle="rgba(255,255,255,.07)"; b.lineWidth=1; b.lineCap="round";
    b.beginPath(); g.major.concat(g.minor).forEach(function(a){ for(var i=0;i<a.length;i+=2){ var p=proj(a[i],a[i+1]); if(i) b.lineTo(p[0],p[1]); else b.moveTo(p[0],p[1]); } }); b.stroke();
    b.fillStyle="#10304e"; b.fill(water);
    b.font="600 12px "+getComputedStyle(document.body).fontFamily; b.fillStyle="rgba(255,255,255,.75)";
    [["Tonlé Sap",104.9235,11.603],["Mekong",104.951,11.590],["Bassac",104.9205,11.535]].forEach(function(t){ var p=proj(t[1],t[2]); b.fillText(t[0],p[0],p[1]); });
    var C=proj(104.9412,11.5571); b.fillStyle="#ffd98a"; b.beginPath(); b.arc(C[0],C[1],4,0,6.283); b.fill(); b.fillText("Chaktomuk",C[0]-78,C[1]+4);
    ctx.drawImage(baseCv,0,0,W0,H0);
    parts=[]; lines.forEach(function(l,li){ var n = l.rv.id==="tonle"?170:l.rv.id==="bassac"?60:150; for(var i=0;i<n;i++){ var q={li:li}; spawn(q,true); parts.push(q); } });
  }
  size(); window.addEventListener("resize",size);
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches, vis=true, running=false;
  function frame(){
    if(!W0){ size(); if(!W0) return; }
    ctx.globalAlpha=.14; ctx.drawImage(baseCv,0,0,W0,H0); ctx.globalAlpha=1;   /* fade = trails */
    ctx.save(); ctx.clip(water);
    for(var i=0;i<parts.length;i++){
      var q=parts[i], l=lines[q.li];
      if(!still){ q.t += q.sp*l.dir; if(q.t<0||q.t>1) spawn(q,false); }
      var p=at(l,q.t), o=p[0]+p[2]*q.off*l.rv.w/KX, a=p[1]+p[3]*q.off*l.rv.w, s=proj(o,a);

      ctx.fillRect(s[0]-1,s[1]-1, l.rv.gold?2.4:1.8, l.rv.gold?2.4:1.8);
    }
    ctx.restore();
    if(!still && vis && !document.hidden) requestAnimationFrame(frame); else running=false;
  }
  function go(){ if(!running){ running=true; requestAnimationFrame(frame); } }
  if("IntersectionObserver" in window) new IntersectionObserver(function(e){ vis=e[0].isIntersecting; if(vis) go(); }).observe(cv);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && vis) go(); });

}

  else base.forEach(function(r){ if(!qm || qm[r]) out.push(r); });

  var kc={}; out.forEach(function(r){ var k=(LS.phone && !(flag[r]&1)) ? null : khan[r]; if(k!==null) kc[k]=(kc[k]||0)+1; });
  out=out.filter(function(r){ return (LS.khan===null || khan[r]===LS.khan) && (!LS.phone || (flag[r]&1)); });
  if(LS.sort==="near" && ME){ var D={}; out.forEach(function(r){ D[r]=dist(ME.lat,ME.lng,lat[r],lng[r]); }); out.sort(function(a,b){ return D[a]-D[b]; }); }

  else out.sort(function(a,b){ return conf[b]-conf[a]; });

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
/* view: {cx,cy (world), s px per world-degree}; world x=(lng-LNG0)*KX, y=(LAT0-lat) */
function drawMap(ctx, w, h, V, opt){

function miniMap(cv, a, o, r){

(function mapInput(){
