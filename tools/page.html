<style>
/*__FONTS__*/
:root{
  --bg:#fbf6ec; --bg2:#f4ecdc; --surface:#ffffff; --glass:rgba(255,255,255,.72);
  --ink:#1b1530; --muted:#5d5670; --faint:#8c86a0; --line:#e7dcc8;
  --gold:#a8720c; --gold-hi:#e8b64c; --lotus:#d23a70; --indigo:#2b2272; --jade:#0b8a5c; --jade-ink:#fff;
  --water:#bcd7ea; --park:#cfe6c4; --watg:#f3dca0; --road:#ddd3c1; --road2:#c9bca4; --street:#e6ddcc;
  --shadow:0 1px 2px rgba(27,21,48,.06),0 8px 28px rgba(27,21,48,.08);
  --r:18px;
  --khmer:"Kantumruy Pro",system-ui,sans-serif;
  --body:"Kantumruy Pro","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Noto Sans Thai",Georgia,serif;
  --moul:"Moul","Kantumruy Pro",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0b1f; --bg2:#141130; --surface:#17142e; --glass:rgba(23,20,46,.72);
  --ink:#f3eee2; --muted:#b3adc9; --faint:#7f7a99; --line:#2b2650;
  --gold:#f0c05a; --gold-hi:#ffd98a; --lotus:#ff6b9a; --indigo:#8f86ff; --jade:#2fd394; --jade-ink:#062a1c;
  --water:#123353; --park:#15321f; --watg:#3a2f14; --road:#342e60; --road2:#4a4282; --street:#241f47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;overflow-x:hidden}
:lang(th) body,body.th{line-height:1.75}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px;border-radius:8px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.kh{font-family:var(--khmer)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;min-height:min(92vh,760px);color:#fff;display:flex;flex-direction:column;overflow:hidden;background:#0d0b1f}
.hero .ph{position:absolute;inset:-4%;z-index:-3;background-size:cover;background-position:center;transform:scale(1.04)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  linear-gradient(180deg,rgba(13,11,31,.55) 0%,rgba(13,11,31,.08) 32%,rgba(13,11,31,.25) 58%,rgba(13,11,31,.94) 100%),
  radial-gradient(90% 70% at 20% 90%,rgba(210,58,112,.28),transparent 60%)}
#motes{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 0;max-width:1100px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;text-decoration:none;opacity:.92}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 14px var(--gold-hi)}
.langs{margin-left:auto;display:flex;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.18)}
.langs button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-size:.86rem;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{background:#fff;color:#1b1530;font-weight:700}
.hero-in{margin-top:auto;padding:0 16px 26px;max-width:1100px;width:100%;margin-left:auto;margin-right:auto}
.clock{font-size:.95rem;opacity:.95;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.clock b{font-variant-numeric:tabular-nums;font-size:1.2rem;letter-spacing:.02em}
.clock .ico{width:20px;height:20px;color:var(--gold-hi)}
.wm{font-family:var(--moul);font-weight:400;font-size:clamp(3.2rem,15vw,7.4rem);line-height:1.25;margin:0;color:#ffe3a3;
  background:linear-gradient(100deg,#fff1c9 0%,#f0c05a 30%,#fff6d8 50%,#e8b64c 70%,#fff1c9 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 26px rgba(240,192,90,.35))}
.wm-sub{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.4rem);font-style:italic;font-weight:500;margin:0 0 4px;line-height:1.2}
.wm-sub .th{font-family:"Noto Sans Thai",sans-serif;font-style:normal;font-size:.62em;opacity:.85;margin-left:.4em}
.sunline{margin:2px 0 16px;opacity:.92;font-size:.98rem;max-width:40ch}

/* where to */
.whereto{display:flex;align-items:center;gap:10px;background:var(--glass);color:var(--ink);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);max-width:620px;position:relative}
.whereto::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;padding:2px;
  background:conic-gradient(from var(--a,0deg),#f0c05a,#ff6b9a,#8f86ff,#2fd394,#f0c05a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
.whereto .ico{color:var(--lotus)}
.whereto input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.08rem;padding:10px 0;color:inherit;outline:none}
.whereto input::placeholder{color:var(--muted)}
.whereto button{border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:10px 18px;font-weight:700;cursor:pointer;min-height:46px}

/* ---------- tiles (Grab-style services) ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin:22px 0 8px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;text-align:center;font-size:.86rem;line-height:1.3;padding:4px 2px;border-radius:14px}
.tile .sq{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 6px 16px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.35);
  background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000))}
.tile .sq .ico{width:30px;height:30px;stroke-width:1.8}
.tile .n{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .tile .sq{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .tile:hover .sq,.tile:focus-visible .sq{transform:translateY(-4px) scale(1.06) rotate(-3deg)}
  .tile:active .sq{transform:scale(.9)}
}

/* ---------- sections ---------- */
section.sec{padding:26px 0 8px}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sh h2{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.1;margin:0}
.sh h2 small{font-family:var(--body);font-size:.95rem;font-weight:400;color:var(--muted);margin-left:.4em}
.sh .more{margin-left:auto;font-size:.9rem;text-decoration:none;color:var(--gold);font-weight:600}
.lede{color:var(--muted);margin:-4px 0 14px;font-size:.95rem;max-width:62ch}
.kicker{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* near */
.nearbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:42px;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.go{background:var(--lotus);color:#fff;border-color:transparent;font-weight:700}
.pill .ico{width:18px;height:18px}
.here{font-size:1.02rem;margin:0 0 12px}
.here b{font-family:var(--serif);font-size:1.3rem}
.rowhead{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-weight:700}
.rowhead .ico{color:var(--c)}
.rowhead a{margin-left:auto;font-weight:600;font-size:.86rem;color:var(--gold);text-decoration:none}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,270px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-height:92px;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--gold))}
.pc .nm{font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .mt{font-size:.8rem;color:var(--muted)}
.pc .d{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--c,var(--gold));font-variant-numeric:tabular-nums}

/* now */
.nowgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.nowgrid{grid-template-columns:1fr 1.2fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
.card h3{margin:0 0 4px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.card h3 .ico{width:18px;height:18px}
.sky{background:linear-gradient(180deg,var(--sky1,#1c1747),var(--sky2,#e0457b));color:#fff;border:0}
.sky h3{color:#ffe3a3}
.sky svg{display:block;width:100%;height:auto;margin:6px 0 4px}
.skyrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.95rem}
.skyrow b{font-variant-numeric:tabular-nums}
.moonline{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:.95rem}
.moonline svg{width:46px;height:46px;flex:none;margin:0}
.river{padding:0;background:#0d1b2e;border:0;color:#fff}
.river canvas{display:block;width:100%;height:420px}
.river .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 12px;background:linear-gradient(180deg,transparent,rgba(5,12,24,.94) 34%)}
.river .cap b{font-family:var(--serif);font-size:1.3rem;line-height:1.2;display:block}
.river .cap small{opacity:.8;font-size:.76rem;line-height:1.45;display:block;margin-top:4px}
.river .cap a{color:#bfe3ff}
.river h3{position:absolute;left:16px;top:14px;color:#bfe3ff}
.hours{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (min-width:820px){.hours{max-width:760px}.hours a.shot{--ratio:48%!important}}

/* linked-image cards: background · scrim · spacer · text */
a.shot{position:relative;display:block;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;background:#1b1530;box-shadow:var(--shadow)}
a.shot .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
a.shot .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,11,31,0) 30%,rgba(13,11,31,.86) 100%)}
a.shot .sp{display:block;padding-top:var(--ratio,72%)}
a.shot .tx{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;line-height:1.3}
a.shot .tx b{display:block;font-size:1.08rem}
a.shot .tx .k{display:block;font-family:var(--khmer);font-size:.88rem;opacity:.88}
a.shot .tx .dist{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.18);padding:1px 8px;border-radius:999px;backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:no-preference){
  a.shot .bg{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
  a.shot:hover .bg,a.shot:focus-visible .bg{transform:scale(1.07)}
}
.cred{display:block;font-size:.66rem;color:var(--faint);margin-top:3px;line-height:1.35}
.cred a{color:inherit}
.golist{grid-auto-columns:min(72%,300px)}

/* soon */
.soon{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);text-decoration:none}
.ev .when{border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background-size:cover;background-position:center;position:relative;isolation:isolate;overflow:hidden}
.ev .when::before{content:"";position:absolute;inset:0;background:rgba(13,11,31,.5);z-index:-1}
.ev .when b{font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.ev .when small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.ev h4{margin:0;font-size:1.05rem;line-height:1.3}
.ev .k{font-family:var(--khmer);font-size:.82rem;color:var(--muted);display:block}
.ev p{margin:2px 0 0;font-size:.9rem;color:var(--muted);line-height:1.5}
.ev .cd{font-weight:700;color:var(--lotus);font-size:.85rem}
.ev .src{font-size:.75rem;color:var(--faint)}

/* bands (site-kit) */
.band{position:relative;isolation:isolate;margin:40px 0 20px;width:100%;min-height:clamp(300px,58vh,560px);display:grid;align-items:end;
  background-size:cover;background-position:center;background-attachment:fixed;background-color:#0d0b1f;color:#fff;text-decoration:none}
.band::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(13,11,31,.35) 0%,rgba(13,11,31,.1) 40%,rgba(13,11,31,.9) 100%)}
.band::after{content:"";position:absolute;inset:0;z-index:-1;mix-blend-mode:multiply;background:radial-gradient(120% 90% at 20% 80%,rgba(210,58,112,.3),transparent 60%)}
.band .in{max-width:1100px;margin:0 auto;padding:28px 16px 34px;width:100%}
.band h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,7vw,4rem);line-height:1;margin:0 0 8px;text-shadow:0 2px 26px rgba(0,0,0,.5)}
.band p{margin:0;max-width:38ch;font-size:1.08rem;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.band .kicker{color:#ffe3a3}
.band .cred{position:absolute;right:0;bottom:0;background:rgba(13,11,31,.7);color:#cfc8e6;padding:2px 8px;margin:0;max-width:70%}
@media (pointer:coarse),(prefers-reduced-motion:reduce){.band{background-attachment:scroll}}

/* loop */
.loopwrap{display:grid;gap:18px}
@media (min-width:860px){.loopwrap{grid-template-columns:1.3fr 1fr;align-items:start}}
.loopmap{width:100%;height:auto;display:block;border-radius:18px;box-shadow:var(--shadow)}
.lm-bg{fill:var(--bg2)}
.lm-water{fill:var(--water)}
.lm-street{fill:none;stroke:var(--street);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.lm-minor{fill:none;stroke:var(--road);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.lm-major{fill:none;stroke:var(--road2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lm-route{fill:none;stroke:var(--lotus);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:0}
.lm-route-glow{fill:none;stroke:var(--gold-hi);stroke-width:9;opacity:.5;stroke-linecap:round;stroke-linejoin:round}
.lm-stop circle{fill:var(--ink);stroke:var(--gold-hi);stroke-width:2.5}
.lm-stop text{fill:var(--bg);font:700 12px var(--body);text-anchor:middle}
.lm-stop:hover circle,.lm-stop:focus circle{fill:var(--lotus)}
@media (prefers-reduced-motion:no-preference){
  .loopmap.draw .lm-route{animation:drawroute 4.5s cubic-bezier(.45,.05,.3,1) both}
  @keyframes drawroute{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
}
.stops{list-style:none;margin:0;padding:0;counter-reset:s}
.stops li{counter-increment:s;display:grid;grid-template-columns:30px 54px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.stops li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.stops img{width:54px;height:40px;object-fit:cover;border-radius:8px}
.stops a{text-decoration:none;font-weight:600;line-height:1.3}
.stops .leg{font-size:.78rem;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* footer */
footer{margin-top:40px;background:var(--bg2);border-top:1px solid var(--line);padding:30px 0 110px;font-size:.86rem;color:var(--muted)}
footer h3{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
footer p{max-width:72ch;margin:0 0 8px}
footer dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0 0 12px;max-width:520px}
footer dd{margin:0;font-variant-numeric:tabular-nums;color:var(--ink)}
.credits{columns:2 260px;column-gap:24px;font-size:.74rem;line-height:1.45}
.credits div{break-inside:avoid;margin-bottom:5px}

/* ---------- bottom nav (Grab-like) ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:4px;padding:6px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;white-space:nowrap;border-radius:999px;text-decoration:none;font-size:.7rem;min-width:62px;color:var(--muted)}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none}
.panel.open{display:block}
@media (prefers-reduced-motion:no-preference){.panel.open{animation:rise .38s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{opacity:0;transform:translateY(24px)}}}
.phead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.phead .t{font-weight:700;font-size:1.05rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:inherit;color:inherit}
.lhero{position:relative;isolation:isolate;min-height:190px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,var(--c,#2b2272),#0d0b1f)}
.lhero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:.85}
.lhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent,rgba(13,11,31,.88))}
.lhero .in{padding:18px 16px;max-width:1100px;margin:0 auto;width:100%}
.lhero h2{font-family:var(--serif);font-size:2.3rem;line-height:1.05;margin:0}
.lhero .k{font-family:var(--khmer)}
.lhero .cred{color:#d9d3ee}
.ltools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
.ltools select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:8px 14px;min-height:42px}
.count{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c,#8c86a0);grid-row:span 2}
.row .dot .ico{width:20px;height:20px}
.row .nm{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row .mt{font-size:.82rem;color:var(--muted);line-height:1.45;grid-column:2;overflow-wrap:anywhere}
.row .side{grid-column:3;grid-row:1/span 2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .d{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--c,var(--gold))}
.row:hover{background:var(--bg2)}
.ride{display:inline-flex;align-items:center;gap:6px;background:var(--jade);color:var(--jade-ink);font-weight:700;border-radius:999px;padding:7px 14px;text-decoration:none;font-size:.88rem;min-height:40px;border:0;cursor:pointer}
.ride .ico{width:18px;height:18px}
.ride.big{padding:12px 22px;font-size:1rem;min-height:50px}
@media (prefers-reduced-motion:no-preference){.ride{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ride:hover{transform:scale(1.05)}.ride:active{transform:scale(.95)}}
.showmore{display:block;margin:18px auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 22px;cursor:pointer;min-height:46px}
.empty{padding:30px 6px;color:var(--muted);max-width:52ch}

/* sheet */
.scrimall{position:fixed;inset:0;z-index:60;background:rgba(8,6,20,.5);display:none;backdrop-filter:blur(2px)}
.scrimall.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.35);
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px}
.sheet .in{padding:6px 18px 12px}
.sheet h2{font-size:1.45rem;line-height:1.25;margin:4px 0 2px;overflow-wrap:anywhere}
.sheet .mt{color:var(--muted);font-size:.9rem}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sheet canvas{width:100%;height:210px;display:block;border-radius:16px;margin:8px 0;background:var(--bg2)}
.sheet .conf{font-size:.75rem;color:var(--faint)}
.sheet .close{position:absolute;right:14px;top:12px}

/* landmark */
.lmhero{position:relative;isolation:isolate;height:min(62vh,520px);color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.lmhero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
@media (prefers-reduced-motion:no-preference){.lmhero .bg{animation:kb 22s ease-in-out infinite alternate}@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}}

.lmhero .in{padding:18px 16px 22px;max-width:900px;margin:0 auto;width:100%}
.lmhero h2{font-family:var(--serif);font-size:clamp(2.2rem,8vw,3.8rem);line-height:1;margin:0}
.lmhero .k{font-family:var(--moul);font-size:clamp(1.2rem,4vw,1.8rem);color:#ffe3a3;line-height:1.6}
.lmhero .t{font-family:"Noto Sans Thai",sans-serif;opacity:.9}
.lmhero .cred{color:#cfc8e6;position:absolute;right:8px;bottom:4px;max-width:60%;text-align:right}
.lmbody{max-width:900px;margin:0 auto;padding:16px}
.lmbody .txt{font-size:1.12rem;max-width:58ch}
.lmbody .txt2{color:var(--muted);max-width:58ch}

/* map */
#mappanel{overflow:hidden}
#bigmap{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--bg2)}
#mappanel .phead{position:absolute;left:0;right:0;top:0}
.mapchips{position:absolute;left:0;right:0;top:66px;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
.mapchips .pill{flex:none;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mapchips .pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapbtns{position:absolute;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;gap:8px}
.maptip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:3px 10px;border-radius:999px;transform:translate(-50%,-150%);white-space:nowrap;opacity:0;transition:opacity .15s}
.medot{position:absolute;z-index:3;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 0 rgba(59,130,246,.6);pointer-events:none;display:none}
@media (prefers-reduced-motion:no-preference){.medot{animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}}
.mapnote{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;font-size:.68rem;color:var(--muted);background:var(--glass);padding:2px 8px;border-radius:8px;max-width:60%}

.kbach{height:22px;margin:30px 0 4px;background:
  radial-gradient(circle at 11px 11px,var(--gold) 2.2px,transparent 2.8px) 0 0/22px 22px repeat-x,

  if(window.PP_CORE){ var C=window.PP_CORE; BASEG.streets=dec(C,C.streets); BASEG.parks=dec(C,C.parks); BASEG.wats=dec(C,C.wats); }

function riverSeasonUp(){ var mo=ppNow().getMonth()+1; return mo>=6 && mo<=10; }

var RIVERS = [
 {id:"tonle", w:.0017, gold:true, pts:[[104.9115,11.63],[104.9178,11.6192],[104.92104,11.6066],[104.9205,11.5922],[104.925,11.5814],[104.9322,11.5706],[104.9376,11.5616],[104.9412,11.5571]]},

 {id:"mekongS", w:.0048, pts:[[104.9475,11.5544],[104.9574,11.5508],[104.9736,11.5454],[104.9916,11.549],[105.01986,11.5508]]},
 {id:"bassac", w:.0012, pts:[[104.9412,11.5544],[104.9376,11.5454],[104.9331,11.5382],[104.934,11.5256],[104.9394,11.5112],[104.9457,11.4932],[104.9511,11.48006]]}

function river(){
  var cv=$("rivercv"), ctx=cv.getContext("2d"), g=baseDecode(), dpr=Math.min(2,window.devicePixelRatio||1);
  var box={w:104.900,e:104.980,s:11.520,n:11.612}, W0,H0,sc,ox,oy, water, baseCv, parts=[];
  var up=riverSeasonUp();
  function proj(o,a){ return [ox+(o-box.w)*KX*sc, oy+(box.n-a)*sc]; }
  var lines = RIVERS.map(function(rv){
    var segs=[], total=0;
    for(var i=1;i<rv.pts.length;i++){ var a=rv.pts[i-1], b=rv.pts[i], L=Math.hypot((b[0]-a[0])*KX,b[1]-a[1]); segs.push([a,b,total,L]); total+=L; }
    var dir = rv.id==="tonle" ? (up?-1:1) : 1;
    return {rv:rv, segs:segs, len:total, dir:dir};
  });
  function at(l,t){ var d=t*l.len; for(var i=0;i<l.segs.length;i++){ var s=l.segs[i]; if(d<=s[2]+s[3]||i===l.segs.length-1){ var k=(d-s[2])/s[3]; var o=s[0][0]+(s[1][0]-s[0][0])*k, a=s[0][1]+(s[1][1]-s[0][1])*k;
      var nx=-(s[1][1]-s[0][1]), ny=(s[1][0]-s[0][0])*KX, nl=Math.hypot(nx,ny)||1; return [o,a,nx/nl,ny/nl]; } } }

    baseCv=document.createElement("canvas"); baseCv.width=cv.width; baseCv.height=cv.height;
    var b=baseCv.getContext("2d"); b.setTransform(dpr,0,0,dpr,0,0);
    b.fillStyle="#0b1626"; b.fillRect(0,0,W0,H0);
    b.strokeStyle="rgba(255,255,255,.07)"; b.lineWidth=1; b.lineCap="round";
    b.beginPath(); g.major.concat(g.minor).forEach(function(a){ for(var i=0;i<a.length;i+=2){ var p=proj(a[i],a[i+1]); if(i) b.lineTo(p[0],p[1]); else b.moveTo(p[0],p[1]); } }); b.stroke();
    b.fillStyle="#10304e"; b.fill(water);
    b.font="600 12px "+getComputedStyle(document.body).fontFamily; b.fillStyle="rgba(255,255,255,.75)";
    [["Tonlé Sap",104.9235,11.603],["Mekong",104.951,11.590],["Bassac",104.9205,11.535]].forEach(function(t){ var p=proj(t[1],t[2]); b.fillText(t[0],p[0],p[1]); });
    var C=proj(104.9412,11.5571); b.fillStyle="#ffd98a"; b.beginPath(); b.arc(C[0],C[1],4,0,6.283); b.fill(); b.fillText("Chaktomuk",C[0]-78,C[1]+4);
    ctx.drawImage(baseCv,0,0,W0,H0);
    parts=[]; lines.forEach(function(l,li){ var n = l.rv.id==="tonle"?170:l.rv.id==="bassac"?60:150; for(var i=0;i<n;i++){ var q={li:li}; spawn(q,true); parts.push(q); } });
  }
  size(); window.addEventListener("resize",size);

    ctx.save(); ctx.clip(water);

      var q=parts[i], l=lines[q.li];

    }

    if(!still && vis && !document.hidden) requestAnimationFrame(frame); else running=false;
  }
  function go(){ if(!running){ running=true; requestAnimationFrame(frame); } }
  if("IntersectionObserver" in window) new IntersectionObserver(function(e){ vis=e[0].isIntersecting; if(vis) go(); }).observe(cv);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && vis) go(); });

  function hover(e){ if(e.pointerType!=="mouse") return; var b=pick(e.offsetX,e.offsetY); if(!b){ tip.style.opacity=0; return; }
    tip.textContent = b.l ? nm(b.l) : rowF(b.r)[0]; tip.style.left=e.offsetX+"px"; tip.style.top=e.offsetY+"px"; tip.style.opacity=1; }
})();
